<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="t">
	<title id="t">Deux personnes regardent ensemble un téléphone : l’une recommande Arvator à l’autre.</title>
	<defs>
		<radialGradient id="glow" cx="50%" cy="48%" r="60%">
			<stop offset="0" stop-color="#C9A227" stop-opacity=".35"/>
			<stop offset=".55" stop-color="#C9A227" stop-opacity=".08"/>
			<stop offset="1" stop-color="#0B0B0C" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#E6C766"/>
			<stop offset=".55" stop-color="#C9A227"/>
			<stop offset="1" stop-color="#A8841B"/>
		</linearGradient>
		<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2A2416"/>
			<stop offset="1" stop-color="#141416"/>
		</linearGradient>
		<linearGradient id="bodyA" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#3B3222"/>
			<stop offset="1" stop-color="#1B1B1E"/>
		</linearGradient>
		<linearGradient id="bodyB" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#5A4826"/>
			<stop offset="1" stop-color="#241F16"/>
		</linearGradient>
	</defs>

	<rect width="480" height="400" fill="#141416"/>
	<rect width="480" height="400" fill="url(#glow)"/>
	<g stroke="#C9A227" stroke-opacity=".12" fill="none">
		<circle cx="240" cy="210" r="150"/>
		<circle cx="240" cy="210" r="205"/>
	</g>

	<!-- Personne de droite (filleule), cheveux longs, penchée vers le téléphone -->
	<path d="M262 400c0-92 22-148 86-156 66 8 92 64 92 156z" fill="url(#bodyB)"/>
	<path d="M330 236h30v22c-10 6-20 6-30 0z" fill="#9C7A48"/>
	<path d="M300 170c-4-52 30-82 66-76 38 6 58 40 52 84-4 34-2 62 10 78-30 6-54-6-66-26-14 22-44 22-62 6 10-18 4-40 0-66z" fill="#1E1A14"/>
	<ellipse cx="350" cy="178" rx="34" ry="40" transform="rotate(-12 350 178)" fill="#B8935A"/>
	<path d="M316 168c6-34 32-52 62-44 16 4 26 16 30 28-22-8-46-4-62 8-10 6-20 10-30 8z" fill="#1E1A14"/>

	<!-- Personne de gauche (parrain), tient le téléphone -->
	<path d="M44 400c0-96 26-150 100-158 72 8 100 62 100 158z" fill="url(#bodyA)"/>
	<path d="M128 228h32v24c-11 7-21 7-32 0z" fill="#8E6C3E"/>
	<ellipse cx="146" cy="176" rx="36" ry="42" transform="rotate(10 146 176)" fill="#A88350"/>
	<path d="M108 168c-4-40 26-66 60-58 26 6 40 28 36 52-14-14-34-18-52-14-14 4-28 12-44 20z" fill="#1E1A14"/>
	<path d="M120 300c30 34 74 40 108 10" stroke="#3B3222" stroke-width="26" stroke-linecap="round" fill="none"/>

	<!-- Téléphone -->
	<g transform="rotate(-10 236 276)">
		<rect x="204" y="214" width="66" height="122" rx="12" fill="#0B0B0C" stroke="url(#gold)" stroke-width="3"/>
		<rect x="211" y="226" width="52" height="98" rx="6" fill="url(#screen)"/>
		<rect x="226" y="219" width="22" height="3" rx="1.5" fill="#C9A227" opacity=".6"/>
		<!-- icône « partager » -->
		<g stroke="#E6C766" stroke-width="2.5" fill="#E6C766">
			<line x1="230" y1="262" x2="248" y2="252"/>
			<line x1="230" y1="262" x2="248" y2="274"/>
			<circle cx="229" cy="262" r="5"/>
			<circle cx="249" cy="251" r="5"/>
			<circle cx="249" cy="275" r="5"/>
		</g>
		<rect x="218" y="294" width="38" height="10" rx="5" fill="url(#gold)"/>
		<rect x="222" y="310" width="30" height="4" rx="2" fill="#A8A29A" opacity=".5"/>
	</g>
	<circle cx="222" cy="312" r="13" fill="#A88350"/>

	<!-- Bulle de validation -->
	<g>
		<circle cx="292" cy="110" r="26" fill="url(#gold)"/>
		<path d="M280 110l8 8 16-17" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
		<path d="M274 128l-12 16 20-8z" fill="#C9A227"/>
	</g>
	<g fill="#E6C766">
		<path d="M230 120l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".8"/>
		<path d="M330 70l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity=".6"/>
		<path d="M410 120l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity=".5"/>
	</g>
</svg>
